    <script>
      function getCookie(name) {
        // Split cookie string into individual cookies
        const cookies = document.cookie.split(";");

        for (let i = 0; i < cookies.length; i++) {
          // Trim spaces and split into [key, value]
          const [cookieName, cookieValue] = cookies[i].trim().split("=");

          // Return decoded value if the name matches
          if (cookieName === name) {
            return decodeURIComponent(cookieValue);
          }
        }
        return ""; // Return null if cookie is not found
      }

      window.sessionName = getCookie("dha_session_name") || "";
    </script>

<script>
  (function () {
    function getSkipTarget() {
      return (
        document.getElementById("pageMain") ||
        document.querySelector("main") ||
        document.getElementById("root") ||
        document.querySelector("[role='main']") ||
        document.body
      );
    }

    function prepareSkipTarget() {
      const target = getSkipTarget();
      const isHomepage = window.isHome || false;

      if (!!isHomepage) {
        const elements = document.getElementsByClassName("dda-banner-card");
        return elements[0] || target;
      }
      if (target && !target.hasAttribute("tabindex")) {
        target.setAttribute("tabindex", "-1");
      }

      return target;
    }

    window.skipToContent = function (event) {
      if (event) {
        event.preventDefault();
      }

      const target = prepareSkipTarget();
      const isHomepage = window.isHome || false;

      if (!target) {
        return false;
      }

      try {
        target.focus({ preventScroll: true });
      } catch (error) {
        target.focus();
      }

      if (!!isHomepage) {
      } else {
        try {
          target.scrollIntoView({ block: "start" });
        } catch (error) {
          target.scrollIntoView();
        }
      }

      return false;
    };

    const skipLink = document.querySelector("[data-skip-to-content]");

    if (skipLink) {
      skipLink.addEventListener("click", window.skipToContent);
    }

    document.addEventListener(
      "keydown",
      function (event) {
        if (event.key === "Tab") {
          document.body.classList.add("portal-keyboard-navigation");
        }
      },
      true,
    );

    document.addEventListener(
      "pointerdown",
      function () {
        document.body.classList.remove("portal-keyboard-navigation");
      },
      true,
    );

    document.addEventListener("DOMContentLoaded", function () {
      const language = String(

      if (skipLink && language.startsWith("ar")) {
        skipLink.textContent = "تخطي إلى المحتوى الرئيسي";
      }

      prepareSkipTarget();
    });
  })();
