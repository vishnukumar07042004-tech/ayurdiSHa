    <script>
      /* LCP preload: first-visit "/" and "/welcome" get slide 1 of the welcome deck; everything else the home hero. */
      (function () {
        var d = document, l = location, seen = true;
        try {
          var s = localStorage;
          seen = !!(s.getItem("aym-welcome-v3") || s.getItem("aym-welcome-seen") || s.getItem("aym-delegate-session"));
        } catch (e) {}
        var deck = l.pathname === "/welcome" || (l.pathname === "/" && (!l.hash || l.hash === "#intro") && !seen);
        function pre(href, media) {
          var k = d.createElement("link");
          k.rel = "preload"; k.as = "image"; k.type = "image/webp"; k.href = href;
          if (media) k.media = media;
          k.setAttribute("fetchpriority", "high");
          d.head.appendChild(k);
        }
        if (deck) pre("/assets/slides/slide-hall.webp");
        else {
          pre("/assets/home/hero-hall.webp", "(min-width: 768px)");
          pre("/assets/home/hero-hall-m.webp", "(max-width: 767px)");
        }
      })();
    </script>
